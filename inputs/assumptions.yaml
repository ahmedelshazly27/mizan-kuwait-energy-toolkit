# Every number the toolkit uses that is not measured Kuwaiti data. One entry per
# assumption, each with its value, unit, source and status:
#   sourced   a Kuwaiti source gives it
#   proxy     no Kuwaiti source exists; the named proxy is used, and why
#   open      not yet decided; evaluation refuses to run while a used entry is open
# Plant configurations refer to entries as assumption:<key>.
assumptions:
  thermal.pvsyst_uc:                   {value: null, unit: W/m2K, status: open, source: null, note: "PVsyst constant heat-loss factor, fixed-tilt free-standing rows"}
  thermal.pvsyst_uc_tracker:           {value: null, unit: W/m2K, status: open, source: null, note: "PVsyst constant heat-loss factor, single-axis trackers"}
  thermal.pvsyst_uv:                   {value: null, unit: W/m2K per m/s, status: open, source: null, note: "PVsyst wind-dependent heat-loss factor"}
  layout.collector_width_1p:           {value: null, unit: m, status: open, source: null, note: "row (table) width across the slope for a one-module-in-portrait tracker; used when a configuration does not give it"}
  soiling.kuwait_rate_by_month:        {value: null, unit: "% per day, Jan..Dec", status: open, source: null, note: "soiling loss accumulation rate in Kuwait by month"}
  soiling.rain_cleaning_threshold:     {value: null, unit: mm per day, status: open, source: null, note: "daily rainfall that cleans modules (Kimber-type model)"}
  soiling.max_loss:                    {value: null, unit: "%", status: open, source: null, note: "ceiling on accumulated soiling loss"}
  losses.dc_mismatch_pct:              {value: null, unit: "%", status: open, source: null}
  losses.dc_wiring_pct:                {value: null, unit: "%", status: open, source: null}
  fx.kwd_per_usd:                      {value: null, unit: KWD per USD, status: open, source: null}
  finance.inflation:                   {value: null, unit: "fraction per year", status: open, source: null, note: "USD inflation used to convert real costs to PySAM's nominal schedules"}
  albedo.desert:                       {value: null, unit: fraction, status: open, source: null, note: "ground albedo for Kuwaiti desert sites"}
  storage.hvac_load:                   {value: null, unit: kW per MWh, status: open, source: null, note: "battery auxiliary cooling load at Kuwaiti ambient temperatures"}
  ro.specific_energy_seawater:         {value: null, unit: kWh/m3, status: open, source: null, note: "Gulf seawater RO, plant-level specific energy"}
  cleaning.effectiveness:              {value: null, unit: fraction, status: open, source: null, note: "share of accumulated soiling removed per cleaning, by method"}
  cleaning.cost:                       {value: null, unit: USD per MWp per cleaning, status: open, source: null, note: "by method"}
  availability.plant:                  {value: null, unit: fraction, status: open, source: null}
  availability.inverter:               {value: null, unit: fraction, status: open, source: null}
  availability.storage:                {value: null, unit: fraction, status: open, source: null}
  degradation.pv_annual:               {value: null, unit: "% per year", status: open, source: null}
  degradation.pv_first_year:           {value: null, unit: "%", status: open, source: null}
  wacc.kuwait_ipp:                     {value: null, unit: "real, fraction", status: open, source: null, note: "Kuwait IPP real WACC"}
  demand.base_shape_nonsummer:         {value: "inputs/demand/kuwait-gross-load-reconstructed.json#fit.params (c1, s1, c2, s2)", unit: "two-harmonic diurnal shape, fraction of the monthly scale", status: proxy, source: "the non-cooling component of the demand model, fitted to May-July daily data only (docs/decisions.md D2, D3)", note: "no sub-daily Kuwaiti load is published for October-April; the fitted shape has a 03:00 maximum that is probably an artefact of fitting on summer days; replace with MEW hourly data when obtained"}
