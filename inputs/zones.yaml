# Zonal structure of the system model (decision D7, docs/decisions.md). Three zones by
# governorate, as in GADM's level-1 shapes used by PyPSA-Earth:
#   north    Al Jahra
#   central  Al Asimah (Capital), Hawalli, Al Farwaniyah
#   south    Al Ahmadi, Mubarak Al-Kabeer
zones: [north, central, south]

# Power stations (dataset plant ids) by zone, from their coordinates in PyPSA-Earth's
# powerplants.csv (Global Energy Monitor / powerplantmatching) joined to the GADM shapes.
# Doha East and Doha West fall in Al Jahra's GADM shape (their governorate could not be
# confirmed from an official source).
stations:
  sabiya: north
  doha-east: north
  doha-west: north
  shagaya: north
  shuwaikh: central
  shuaiba-north: south
  shuaiba-south: south
  zour-south: south
  zour-north: south

# Load shares: MEW Statistical Year Book Electrical Energy 2023, p86, "Loads of Kuwait
# areas during the yearly peak load" (dataset table regional-peak), 2 Aug 2023. Each
# numbered row is assigned to the zone where most of its listed districts lie, read
# from the page image (the Arabic text layer is unusable). Row 1 (the generating
# stations' own load) is split by station capacity in each zone. The shares are of the
# peak and are applied to every hour (a stated simplification).
area_rows:
  1:  {zone: stations, reading: "generating stations' own load"}
  2:  {zone: south,   reading: "Az-Zour South station: Az-Zour, Khiran, Nuwaiseeb, Khiran Pearl, Sabah Al-Ahmad sea pumping"}
  3:  {zone: central, reading: "Doha East station: parts of Ardiya, Doha, Sulaibiya, Firdous, Andalus, Sulaibikhat, Riggae, Jahra, Qairawan"}
