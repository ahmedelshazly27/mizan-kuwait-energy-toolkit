# Transfer capacity between zones (MVA): the sum of line ratings crossing each zone
# boundary in PyPSA-Earth's base network for Kuwait (lines from Overture Maps, built
# from OpenStreetMap; ratings are PyPSA-Earth's standard line types, not MEW's
# ratings). Aggregated here; no line geometry is redistributed.
interfaces:
  central-north: 5530
  central-south: 15520
  north-south: 13196
