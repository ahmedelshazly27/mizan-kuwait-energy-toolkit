[project]
name = "kuwait-energy-toolkit"
version = "0.0.1"
description = "Plant configuration workbench and system context for Kuwait, on validated Kuwaiti inputs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "pydantic==2.11.7",
  "pyyaml==6.0.2",
  "pandas==2.3.1",
  "numpy==2.2.6",
  "scipy==1.16.1",
]

[project.optional-dependencies]
pv = ["pvlib==0.13.0"]
econ = ["nrel-pysam==7.0.0"]
system = ["pypsa==0.35.1", "highspy==1.11.0"]
resource = ["atlite==0.4.1", "cdsapi==0.7.6", "rasterio==1.4.3"]
water = ["watertap==1.4.0"]
dist = ["pandapower==3.1.2"]

[project.scripts]
kwtk = "kwtk.cli:main"

[dependency-groups]
dev = [
    "ipykernel==6.30.1",
    "matplotlib==3.10.5",
    "nbclient==0.10.2",
    "nbformat==5.10.4",
    "pytest==8.3.3",
    "ruff==0.6.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kwtk"]

[tool.ruff]
line-length = 110
