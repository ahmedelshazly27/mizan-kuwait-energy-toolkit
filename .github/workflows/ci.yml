name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {version: "0.11.32"}
      - name: install (pinned)
        run: uv sync --locked --extra pv --extra econ --extra system
      - name: dataset snapshot matches its manifest
        run: uv run kwtk inputs verify
      - name: every configuration validates
        run: uv run kwtk validate configs/examples/*.yaml configs/reference/*.yaml
      - name: tests
        run: uv run pytest -q
      - name: reference plants evaluate offline
        run: |
          for f in configs/reference/*.yaml; do uv run kwtk evaluate "$f"; done
